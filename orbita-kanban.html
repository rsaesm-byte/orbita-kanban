:root[data-depth="0"] .col { box-shadow: none; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 12px; }

.ck-gl { font: 700 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin-top: 4px; } .ck-gi { display: flex; flex-wrap: wrap; gap: 5px; }

/* ===== Spotlight (busca no estilo do macOS) ===== */
.scrim.spl-scrim { background: rgb(0 0 0 / .3); backdrop-filter: blur(8px) saturate(1.15); -webkit-backdrop-filter: blur(8px) saturate(1.15); animation: splFade .2s ease-out; }
@keyframes splFade { from { opacity: 0; } }
.modal.spl { top: 14vh; width: min(700px, calc(100% - 20px)); max-height: 72vh; border-radius: 22px; border: 1px solid color-mix(in oklab, var(--ink) 14%, transparent);
  background: color-mix(in oklab, var(--surface) 76%, transparent); backdrop-filter: blur(46px) saturate(1.9); -webkit-backdrop-filter: blur(46px) saturate(1.9);
  box-shadow: 0 34px 90px -22px rgb(0 0 0 / .65), 0 0 0 .5px rgb(0 0 0 / .4), inset 0 1px 0 rgb(255 255 255 / .16); overflow: hidden; animation: splIn .24s cubic-bezier(.2, .9, .3, 1.15); }
@keyframes splIn { from { opacity: 0; transform: translateX(-50%) scale(.93) translateY(-10px); } }
.spl-bar { display: flex; align-items: center; gap: 12px; padding: 0 18px; } .spl-bar .ic { width: 24px; height: 24px; flex: none; color: var(--ink2); stroke-width: 1.7; }
.spl-bar .pal-in { flex: 1; border: 0; background: none; font-size: 24px; font-weight: 300; letter-spacing: -.01em; padding: 18px 0; color: var(--ink); border-radius: 0; min-width: 0; } .spl-bar .pal-in::placeholder { color: var(--ink3); }
.spl-bar kbd { flex: none; font: 600 11px var(--mono); color: var(--ink3); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.spl .pal-list { border-top: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); padding: 6px 8px 8px; }
.spl .pal-sec { padding: 10px 12px 4px; font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--ink3); font-weight: 600; }
.spl .pal-item { gap: 12px; padding: 7px 10px; border-radius: 11px; align-items: center; transition: background .08s; }
.spl .pal-item .pi-t { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; color: #fff; background: var(--tc, var(--ink3)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .25); font-weight: 800; font-size: 16px; } .spl .pal-item .pi-t .ic { width: 17px; height: 17px; stroke-width: 2; }
.spl .pal-item .pi-b { display: grid; min-width: 0; flex: 1; text-align: left; } .spl .pal-item .pi-b b { font-weight: 600; font-size: 14.5px; } .spl .pal-item .pi-b small { margin: 0; color: var(--ink3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spl .pal-item .tk { font: 500 11.5px var(--mono); color: var(--ink3); }
.spl .pal-item .pi-k { flex: none; font: 600 11px var(--mono); color: var(--ink3); background: none; border: 0; opacity: 0; } .spl .pal-item.on .pi-k { opacity: .9; }
.spl .pal-item.on { background: var(--accent); color: var(--accent-ink, #fff); } .spl .pal-item.on .pi-b small, .spl .pal-item.on .tk, .spl .pal-item.on .pi-k { color: inherit; opacity: .85; }
.spl .pal-item.on .pi-t { background: rgb(255 255 255 / .22); }
.spl .pal-item .pi-t.eq { font-size: 20px; }
.spl .pal-foot { border-top: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); background: transparent; padding: 8px 16px; }
:root[data-calm="on"] .modal.spl, :root[data-calm="on"] .scrim.spl-scrim { animation: none; }
@media (max-width: 720px) { .modal.spl { top: calc(10px + env(safe-area-inset-top)); } .spl-bar .pal-in { font-size: 19px; padding: 15px 0; } .spl .pal-foot { display: none; } }
body:has(.modal.spl) .toasts { display: none; }

.burn-box { position: fixed; z-index: 400; pointer-events: none; }
.burn-paper { position: absolute; inset: 0; border-radius: 6px; padding: 10px 12px 10px 30px; color: #2b3a67; font: 600 14px/22px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; overflow: hidden; box-sizing: border-box;
  background: linear-gradient(#fdfbf3, #fdfbf3) padding-box; background-image: repeating-linear-gradient(transparent 0 21px, #a9c4e8 21px 22px), linear-gradient(#fdfbf3, #fdfbf3); box-shadow: 0 6px 18px rgb(0 0 0 / .35); }

.burn-paper span { display: block; word-break: break-word; }
.burn-fx { position: absolute; pointer-events: none; mix-blend-mode: normal; }

/* nome do campo legível: em telas estreitas o nome ganha uma linha própria, largura toda, e o valor fica logo abaixo */
.info-row .lbl-inp { min-height: 38px; }
@media all {
  .info-row { grid-template-columns: 20px minmax(0, 1fr) auto; row-gap: 5px; }
  .info-row .grip { grid-column: 1; grid-row: 1; }
  .info-row .lbl-inp { grid-column: 2; grid-row: 1; font-size: 14px; padding: 9px 10px; }
  .info-row > .info-side { grid-column: 3; grid-row: 1; }
  .info-row > .info-val { grid-column: 2 / -1; grid-row: 2; }
  .info-row { padding-bottom: 8px; border-bottom: 1px dashed color-mix(in oklab, var(--ink) 12%, transparent); }
  .info-side .ftype { width: 74px; max-width: 74px; font-size: 12px; padding: 6px 4px; }
}

.drawer [data-bf] { position: relative; }
.bf-x { position: absolute; top: -2px; right: 0; width: 22px; height: 22px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--ink3); opacity: .35; cursor: pointer; padding: 0; z-index: 2; }

.bf-restore .tags { margin-top: 6px; }
@media (pointer: coarse) { .bf-x { opacity: .6; width: 28px; height: 28px; } }

/* o verso (lista do checklist) não pode esticar o cartão: só ocupa altura quando virado */

.card.flipped .face.back { max-height: 460px; padding-top: var(--pad); padding-bottom: var(--pad); border-width: 1px; border-left-width: 4px; }
.card.flipped .face.front { align-self: start; }

   Reescreve as regras @media de largura para valerem sempre (celular) ou nunca (computador). */
(function () {
  try {
    const m = localStorage.getItem("orbita_layout") || "auto"; document.documentElement.dataset.layout = m; if (m === "auto") return;
    const big = c => { if (/prefers|min-|orientation|hover/.test(c)) return false; const w = c.match(/max-width:\s*(\d+)px/g); return !!w && w.every(x => +x.match(/(\d+)/)[1] >= 640); };
    for (const sh of document.styleSheets) { let rules; try { rules = sh.cssRules; } catch { continue; } for (const r of rules) if (r.type === 4 && r.media && /max-width/.test(r.media.mediaText) && r.media.mediaText.split(",").some(big)) r.media.mediaText = m === "mobile" ? "all" : "not all"; }
    if (m === "desktop" && navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) <= 600) { const v = document.querySelector('meta[name="viewport"]'); if (v) v.content = "width=1200, viewport-fit=cover"; }
  } catch (e) {}
})();

      const loop = now => { if (!cv) return; raf = requestAnimationFrame(loop); if (document.hidden || now - lt < 33) return; lt = now; draw(now); };
      if (motion) raf = requestAnimationFrame(loop); else draw(performance.now());
      cv.addEventListener("webglcontextlost", e => { e.preventDefault(); const k = on; stop(); setTimeout(() => { if (document.documentElement.getAttribute("data-skin") === k) start(k); }, 500); });
    } catch (e) { console.warn("fundo WebGL", e); cv.classList.add("nogl"); }
  };
  const sync = () => { const sk = document.documentElement.getAttribute("data-skin"); if (!SCN[sk]) return stop(); const key = sk + (fxOn() ? 1 : 0); if (key !== on || !cv) { start(sk); on = key; } };
  new MutationObserver(() => setTimeout(sync, 0)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-skin", "data-calm"] });
  let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (cv && cv._size) cv._size(); }, 150); });
  sync();
})();
window.addEventListener("resize", () => { if (ui.view === "orbita" || ui.view === "relatorios") renderView(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pull(); checkDue(); } });
setInterval(() => { $$("[data-timer]").forEach(el => { const t = task(el.dataset.timer); if (t) el.textContent = fmtClock(spent(t)); }); }, 1000);
setInterval(() => checkDue(), 60000);
iniciarSalvamento();

/* ===== Reordenar os campos "Dados do chamado" arrastando para cima/baixo (mouse e toque) ===== */
(function () {
  let d = null;
  document.addEventListener("pointerdown", e => {
    const g = e.target.closest && e.target.closest(".info-row .grip, .chk-row .grip"); if (!g) return;
    const row = g.closest(".info-row, .chk-wrap") || g.closest(".chk-row"), list = row.parentElement; e.preventDefault();
    d = { row, list, id: e.pointerId, y0: e.clientY, grip: g }; row.classList.add("dragging");
    try { g.setPointerCapture(e.pointerId); } catch {}
  });
  document.addEventListener("pointermove", e => {
    if (!d || e.pointerId !== d.id) return;
    const { row, list } = d; row.style.transform = `translateY(${e.clientY - d.y0}px) scale(1.02)`;
    const others = [...list.children].filter(x => x !== row);
    for (const o of others) {
      const r = o.getBoundingClientRect(), mid = r.top + r.height / 2, me = row.getBoundingClientRect(), my = me.top + me.height / 2;
      const below = o.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_FOLLOWING;   // o vem antes de row
      if (below && my < mid) { const h0 = row.getBoundingClientRect().top; list.insertBefore(row, o); d.y0 += row.getBoundingClientRect().top - h0; row.style.transform = `translateY(${e.clientY - d.y0}px) scale(1.02)`; break; }
      if (!below && my > mid) { const h0 = row.getBoundingClientRect().top; list.insertBefore(row, o.nextSibling); d.y0 += row.getBoundingClientRect().top - h0; row.style.transform = `translateY(${e.clientY - d.y0}px) scale(1.02)`; break; }
    }
    const lr = list.getBoundingClientRect(); const sc = list.closest(".d-body"); if (sc) { const b = sc.getBoundingClientRect(); if (e.clientY > b.bottom - 40) sc.scrollTop += 8; else if (e.clientY < b.top + 40) sc.scrollTop -= 8; }
  });
  const end = e => {
    if (!d || (e && e.pointerId !== d.id)) return;
    const { row, list } = d; d = null; row.classList.remove("dragging"); row.style.transform = "";
    if (row.classList.contains("chk-wrap")) { const t = cur(), by = Object.fromEntries(t.check.map(c => [c.id, c])); t.check = [...list.children].map(x => by[x.dataset.ck]).filter(Boolean); }
    else { const m = modelOf(cur()), by = Object.fromEntries(m.fields.map(f => [f.id, f])); m.fields = [...list.children].map(x => by[x.dataset.k]).filter(Boolean); } save(); render(); renderDrawer();
  };
  document.addEventListener("mousedown", e => { if (e.target.closest && e.target.closest(".info-row .grip, .chk-row .grip")) e.preventDefault(); });
  document.addEventListener("selectstart", e => { if (d) e.preventDefault(); });
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();

/* ===== Ciclar entre quadros: roda do mouse (desktop) e deslizar o dedo (celular) sobre o seletor ===== */
(() => {
  const zone = document.querySelector(".top .brand"); if (!zone) return;
  const cycle = dir => { const L = state.boards; if (L.length < 2) return; const i = L.findIndex(b => b.id === board().id), nx = L[(i + dir + L.length) % L.length];
    ui.armed = null; transit(dir > 0 ? "turn" : "turn", () => { setBoard(nx.id); render(); }); haptic && haptic(); };
  let lock = 0, acc = 0;
  zone.addEventListener("wheel", e => {
    if (state.boards.length < 2 || $("#board-menu").open || document.activeElement === $("#board-name") || e.ctrlKey) return;
    e.preventDefault(); acc += e.deltaY || e.deltaX; const now = Date.now(); if (now < lock || Math.abs(acc) < 30) return;
    cycle(acc > 0 ? 1 : -1); acc = 0; lock = now + 320;
  }, { passive: false });
  let sx = 0, sy = 0, st = 0, on = false;
  zone.addEventListener("touchstart", e => { if (e.touches.length !== 1) { on = false; return; } const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); on = true; }, { passive: true });
  zone.addEventListener("touchend", e => { if (!on) return; on = false; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (state.boards.length < 2 || $("#board-menu").open || Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - st > 900) return;
    e.preventDefault(); cycle(dx < 0 ? 1 : -1); }, { passive: false });
})();
