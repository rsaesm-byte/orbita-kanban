<style>
/* Layout: uma bancada de trabalho. Colunas sao lajes com espessura, cartoes inclinam sob o cursor
   e viram para mostrar o verso. A cor de destaque e customizavel por matiz (--ah). */
@property --spin { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
@property --tilt { syntax: "<angle>"; inherits: true; initial-value: 62deg; }
@property --so { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
:root {
  --ah: 190;
  --bg: #e6ecec; --bg2: #d8e1e1; --surface: #ffffff; --surface2: #f2f6f6;
  --ink: #0f1f20; --ink2: #47595b; --ink3: #74878a; --line: #cdd8d8; --edge: #b4c2c2;
  --accent: oklch(0.5 0.1 var(--ah)); --accent-ink: #ffffff; --accent-soft: oklch(0.93 0.04 var(--ah));
  --p0: #cf2f36; --p1: #c9650a; --p2: #8f7400; --p3: #557585;
  --s1: #6b5fd3; --s2: #0b8f87;
  --tl: 0.93; --tc: 0.045; --tt: 0.36;
  --shadow: 15 40 42; --glow: .3; --glow2: .55; --dim: 15 31 32 / .22;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --pad: 12px; --gap: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1415; --bg2: #101c1d; --surface: #172527; --surface2: #1e2f31;
    --ink: #e6f1ef; --ink2: #a6baba; --ink3: #778f90; --line: #2b4042; --edge: #070d0e;
    --accent: oklch(0.78 0.12 var(--ah)); --accent-ink: #06201f; --accent-soft: oklch(0.33 0.05 var(--ah));
    --p0: #ff6b6f; --p1: #ffa04d; --p2: #e6c84a; --p3: #8fb0c0;
    --s1: #9085e9; --s2: #24a89e;
    --tl: 0.34; --tc: 0.06; --tt: 0.9;
    --shadow: 0 0 0; --glow: .1; --glow2: .14; --dim: 0 0 0 / .5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1415; --bg2: #101c1d; --surface: #172527; --surface2: #1e2f31;
  --ink: #e6f1ef; --ink2: #a6baba; --ink3: #778f90; --line: #2b4042; --edge: #070d0e;
  --accent: oklch(0.78 0.12 var(--ah)); --accent-ink: #06201f; --accent-soft: oklch(0.33 0.05 var(--ah));
  --p0: #ff6b6f; --p1: #ffa04d; --p2: #e6c84a; --p3: #8fb0c0;
  --s1: #9085e9; --s2: #24a89e;
  --tl: 0.34; --tc: 0.06; --tt: 0.9;
  --shadow: 0 0 0; --glow: .1; --glow2: .14; --dim: 0 0 0 / .5;
  color-scheme: dark;
}
:root[data-density="compact"] { --pad: 8px; --gap: 6px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- topo ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: radial-gradient(circle at 30% 20%, #0b1636, #000 75%); box-shadow: 0 0 0 1px rgb(240 190 80 / .35), 0 4px 14px -4px rgb(47 123 255 / .55), inset 0 0 12px rgb(47 123 255 / .18); transition: box-shadow .3s, transform .3s; }
.logo svg { width: 30px; height: 30px; overflow: visible; }
.logo:hover { box-shadow: 0 0 0 1px rgb(240 190 80 / .7), 0 6px 20px -4px rgb(240 190 80 / .55), inset 0 0 14px rgb(47 123 255 / .3); transform: translateY(-1px) rotate(-4deg); }
.lg-moon, .lg-orb { transform-origin: 50px 50px; }
.lg-moon { animation: lgSpin 14s linear infinite; }
@keyframes lgSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .lg-moon { animation: none; } }
.board-name { font: 700 20px/1.1 var(--display); letter-spacing: -0.01em; background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; width: 14ch; min-width: 0; }
.board-name:hover, .board-name:focus { border-color: var(--line); background: var(--surface); }
.tabs { display: flex; gap: 2px; background: var(--bg2); padding: 3px; border-radius: 10px; }
.tabs a { padding: 5px 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(var(--shadow) / .18); }
.brand .menu-body { left: 0; right: auto; width: 250px; }
.menu-body button.on { background: var(--accent-soft); font-weight: 600; }
.menu-body button small { float: right; color: var(--ink3); font-weight: 400; }
.menu-body hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { color: var(--p0); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.search-btn { color: var(--ink3); min-width: 190px; justify-content: flex-start; }
.search-btn kbd { margin-left: auto; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink2); background: var(--surface2); }
.bell { position: relative; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--p0); color: #fff; font: 600 10px/17px var(--body); text-align: center; padding: 0 4px; }

.strip { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.next { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pc, var(--accent)); border-radius: 8px; padding: 5px 10px; max-width: 100%; min-width: 0; text-align: left; }
.next small { color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; font-weight: 600; }
.next b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.sync { font-size: 12px; color: var(--ink3); display: inline-flex; align-items: center; gap: 5px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--s2); }
.sync.busy::before { background: var(--p2); } .sync.err::before { background: var(--p0); }

main { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---------- quadro ---------- */
.board { padding: 6px 16px 28px; min-height: 100%; width: max-content; perspective: 1500px; perspective-origin: 50% 20vh; }
.stage { display: flex; gap: 14px; align-items: flex-start; transform-style: preserve-3d; transform-origin: 50vw 30vh; transform: rotateX(var(--bx, 0deg)) rotateY(var(--by, 0deg)); transition: transform .3s ease-out; }
.col { width: 292px; flex: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column;
  box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 3px 0 var(--edge), 0 4px 0 var(--edge), 0 5px 0 var(--edge), 0 16px 26px -10px rgb(var(--shadow) / .35);
  transform-origin: 50% 0; transition: transform .35s; }
/* Total: profundidade de verdade. A altura do cartão é a prioridade, a sombra fica no chão da coluna e tudo responde à câmera */
@property --z { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --cx { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --cy { syntax: "<length>"; inherits: true; initial-value: 0px; }
:root[data-depth="2"] .col, :root[data-depth="2"] .col-list { transform-style: preserve-3d; }
:root[data-depth="2"] .card { perspective: none; transform-style: preserve-3d; --z: calc(8px + (3 - var(--p, 2)) * 15px); translate: var(--cx) var(--cy) var(--z); transition: transform .18s ease-out, --z .35s cubic-bezier(.2,.8,.2,1), --cx .35s cubic-bezier(.2,.8,.2,1), --cy .35s cubic-bezier(.2,.8,.2,1); animation: bob 6s ease-in-out infinite; animation-delay: calc(var(--j, 0) * -1.3s - var(--i, 0) * .7s); }
:root[data-depth="2"] .card:hover { --z: 78px; }

:root[data-depth="2"] .board.enter .card { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) backwards, bob 6s ease-in-out infinite; animation-delay: calc(var(--i) * 80ms + var(--j) * 55ms + 240ms), calc(var(--j, 0) * -1.3s - var(--i, 0) * .7s); }
@keyframes bob { 50% { translate: var(--cx) var(--cy) calc(var(--z) + 8px); } }
.ghost { animation: none !important; translate: none !important; perspective: 900px !important; }
.ghost::before { display: none !important; }
/* vida: quem está atrasado pulsa, quem está com o cronômetro ligado respira */
:root:not([data-depth="0"]) .card.late .face { animation: late 1.8s ease-in-out infinite; }

.motes { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
:root:not([data-depth="0"]) .col:hover { transform: translateZ(30px); }

.board.enter .col { animation: colIn .65s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms); }
@keyframes colIn { from { transform: rotateX(-72deg) translateZ(-140px) translateY(50px); opacity: 0; } }
.board.enter .card { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms + var(--j) * 55ms + 240ms); }
@keyframes cardIn { from { transform: perspective(600px) translateY(-28px) rotateX(60deg) scale(.9); opacity: 0; } }
:root[data-depth="0"] .col { box-shadow: none; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 12px; }

.empty { color: var(--ink3); font-size: 12px; text-align: center; padding: 14px 0; border: 1px dashed var(--line); border-radius: 10px; }

.col-add { flex: none; width: 150px; border: 1px dashed var(--line); background: none; border-radius: 14px; padding: 12px; color: var(--ink2); }
.menu { position: relative; }
.menu summary { list-style: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; cursor: pointer; color: var(--ink2); }

.menu-body { position: absolute; right: 0; top: 30px; z-index: 30; width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 4px; box-shadow: 0 14px 30px -8px rgb(var(--shadow) / .4); }

.hues { display: flex; gap: 5px; padding: 4px 8px; flex-wrap: wrap; }

/* cartao */
.card { position: relative; transform: translateY(var(--ty, 0px)) scale(var(--mag, 1)); z-index: var(--mz, 0); transition: transform .18s ease-out, filter .25s; perspective: 900px; user-select: none; -webkit-user-select: none; cursor: grab; border-radius: 10px; }

  box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 6px 12px -6px rgb(var(--shadow) / .35); }

.card:hover .card-in { --lift: 14px; }

.p0 { --pc: var(--p0); } .p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); } .p3 { --pc: var(--p3); }
.c-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tk { font: 500 11.5px var(--mono); color: var(--ink2); white-space: nowrap; }
.pri { font-size: 11px; font-weight: 600; color: var(--pc); display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: .04em; }

.card h3 { margin: 0; font: 600 14px/1.3 var(--body); overflow-wrap: anywhere; }

.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: oklch(var(--tl) var(--tc) var(--h)); color: oklch(var(--tt) 0.09 var(--h)); border: 0; white-space: nowrap; }
button.tag { opacity: .45; } button.tag.on { opacity: 1; box-shadow: 0 0 0 1.5px oklch(var(--tt) 0.09 var(--h)); }
.c-meta { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: 12px; flex-wrap: wrap; }
.c-meta span { display: inline-flex; align-items: center; gap: 4px; }

.due.over { color: var(--p0); font-weight: 600; } .due.today { color: var(--p1); font-weight: 600; } .due.soon { color: var(--p2); font-weight: 600; }
.icon-btn { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: none; border-radius: 6px; color: var(--ink3); padding: 0; }

.back label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; }

.running .face { border-color: var(--accent); }
.ph { border: 2px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); opacity: .7; flex: none; }
.ghost { transition: none; filter: none !important; position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; cursor: grabbing; }

/* ---------- orbita ---------- */
.orbit-wrap { padding: 6px 16px 24px; }

.orbit:active { cursor: grabbing; }

.ring-l { display: block; font: 500 10.5px var(--mono); color: var(--ink2); white-space: nowrap; background: var(--bg); border: 1px solid var(--line); padding: 0 7px; border-radius: 99px; translate: 0 50%; }

.sun { width: 66px; height: 66px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(circle at 35% 30%, #ffe2a8, #f5a623 60%, #c9650a); color: #3a1d00; font: 700 19px/1 var(--display); box-shadow: 0 0 40px 6px rgb(245 166 35 / .45); }

.donut { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }

/* ---------- gaveta / modais ---------- */
.scrim { position: fixed; inset: 0; background: rgb(8 16 17 / .45); z-index: 100; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.att-thumb img { width: 100%; height: 78px; object-fit: cover; display: block; }
.att-thumb.doc { cursor: pointer; } .att-thumb.doc span { font: 600 13px var(--mono); color: var(--ink2); border: 1.5px solid var(--ink3); border-radius: 6px; padding: 6px 8px; text-transform: uppercase; }

.drawer.dropping { outline: 3px dashed var(--accent); outline-offset: -6px; }
.lb { position: fixed; inset: 0; z-index: 4000; background: rgb(6 12 13 / .86); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }

.xrow { display: grid; grid-template-columns: 36% 1fr 26px; gap: 6px; align-items: center; }
.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }

const newCols = b => [["A fazer", 290, 0, false], ["Em andamento", 60, 3, false], ["Concluído", 150, 0, true]].map(([name, hue, wip, done]) => ({ id: uid(), name, hue, wip, done, board: b }));
function defaultState() { const d = demoState(); d.tasks = []; return d; }
function normalize(s) {
  const d = defaultState();

let state = defaultState();
let notified = {};
try { notified = JSON.parse(localStorage.getItem(LSN)) || {}; } catch {}
const ui = { board: (() => { try { return localStorage.getItem(LSB); } catch { return null; } })(), view: "quadro", drawer: null, overlay: null, flipped: new Set(), f: { pri: new Set(), tags: new Set(), due: "" }, sort: { k: "due", dir: 1 }, period: 14, pal: { q: "", i: 0, items: [] }, undo: null, refocus: null, sync: "local", armed: null };

/* ---------- salvamento automático em 3 camadas (+ nuvem quando aberto pelo Claude) ---------- */
const EMBED = (() => { try { return window.self !== window.top; } catch { return true; } })();
const SAVE_CFG = { appId: "orbita-kanban", lsKey: "orbita_kanban_dados_v1", dbName: "orbita_kanban_db", arquivoSugerido: "orbita-kanban-dados.json",
  listas: ["boards", "tasks", "columns", "tags", "fields", "templates"], debounceMs: 1500, conferirArquivoMs: 20000,
  AUTO_DOWNLOAD_SEM_API: !EMBED && !matchMedia("(pointer: coarse)").matches };
const FS_OK = !EMBED && !!(window.showSaveFilePicker && window.showOpenFilePicker);
let rev = 0, revAoAbrir = 0, localSalvoEm = "", lastBrowserSave = null;
let handle = null, pendingHandle = null, fileTimer = null, gravando = false;
let fileRev = -1, lastFileSha = null, lastFileMod = null, lastFileTime = null, overwriteNext = false;
let meta = (() => { try { return JSON.parse(localStorage.getItem(SAVE_CFG.lsKey + "_meta")) || {}; } catch { return {}; } })();
const saveMeta = () => { try { localStorage.setItem(SAVE_CFG.lsKey + "_meta", JSON.stringify(meta)); } catch {} };
const esperar = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);

/* IndexedDB chave-valor */
let _idb;
function idb() { return _idb || (_idb = new Promise((res, rej) => { try { const r = indexedDB.open(SAVE_CFG.dbName, 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } })); }
async function kvGet(k) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kvKeys() { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction("kv").objectStore("kv").getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kvSet(k, v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("kv", "readwrite"); v === undefined ? t.objectStore("kv").delete(k) : t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function sha256(t) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } catch { return null; } }
function tomb(...ids) { state.deleted = state.deleted || {}; const t = new Date().toISOString(); ids.forEach(id => id && (state.deleted[id] = t)); }
const valido = d => d && Array.isArray(d.columns) && Array.isArray(d.tasks);

/* junta dois bancos por id; em conflito vale o principal (p); excluídos somem dos dois */
function mergeById(a = [], b = [], dead) { const ids = new Set(a.map(x => x.id)); return a.filter(x => !dead[x.id]).concat(b.filter(x => !ids.has(x.id) && !dead[x.id])); }
function mergeStates(p, s) {
  p = Object.assign(defaultState(), p); s = Object.assign(defaultState(), s);
  const dead = Object.assign({}, s.deleted, p.deleted), o = Object.assign(defaultState(), s, p); o.deleted = dead;
  SAVE_CFG.listas.forEach(k => o[k] = mergeById(p[k], s[k], dead));
  return normalize(o);
}
function refresh() { applySettings(); render(); if (ui.drawer) { if (!task(ui.drawer)) closeLayer(); } else if (ui.overlay === "set") openSettings(); else if (ui.overlay === "wiz") closeLayer(); setSaveStatus(); }

/* ===== camada 1: navegador (IndexedDB + localStorage) ===== */
function save() { state.updatedAt = Date.now(); rev++; persistir(); agendar(); queueRemote(); }   // chamada após toda alteração
async function persistir() {
  const salvoEm = new Date().toISOString(); localSalvoEm = salvoEm; const rec = { salvoEm, rev, dados: state };
  try { const j = JSON.stringify(rec); j.length < 4.5e6 ? localStorage.setItem(SAVE_CFG.lsKey, j) : localStorage.removeItem(SAVE_CFG.lsKey); } catch {}
  lastBrowserSave = new Date(); setSaveStatus();
  try { await kvSet("dados", JSON.parse(JSON.stringify(rec))); } catch {}
}
function persistirSync() { if (!rev) return; try { const j = JSON.stringify({ salvoEm: new Date().toISOString(), rev, dados: state }); if (j.length < 4.5e6) localStorage.setItem(SAVE_CFG.lsKey, j); } catch {} }
async function carregar() {
  let ls = null, ix = null;
  try { const raw = localStorage.getItem(SAVE_CFG.lsKey); if (raw) ls = JSON.parse(raw); } catch {}
  try { ix = await esperar(kvGet("dados"), 2000); } catch {}
  const best = [ls, ix].filter(x => x && valido(x.dados)).sort((a, b) => String(b.salvoEm || "").localeCompare(String(a.salvoEm || "")))[0];
  if (!best) return false;
  state = normalize(best.dados); rev = best.rev || 1; localSalvoEm = best.salvoEm || ""; lastBrowserSave = best.salvoEm ? new Date(best.salvoEm) : null; return true;
}

/* ===== camada 2: arquivo .json (File System Access API, Chrome/Edge) ===== */
function agendar() { if (!handle) return; clearTimeout(fileTimer); fileTimer = setTimeout(gravarArquivo, SAVE_CFG.debounceMs); setSaveStatus(); }
async function lerArquivo(h) {
  const f = await h.getFile(), txt = await f.text();
  if (!txt.trim()) return { empty: true, lastModified: f.lastModified };
  const obj = JSON.parse(txt), dados = obj && obj.dados ? obj.dados : obj;
  if (!valido(dados)) throw new Error("formato");
  let sha = obj.sha256 || null, ok = true;
  if (obj.sha256) { const c = await sha256(JSON.stringify(obj.dados)); ok = !c || c === obj.sha256; } else sha = await sha256(JSON.stringify(dados));
  return { dados, sha, ok, salvoEm: obj.salvoEm || "", lastModified: f.lastModified };
}
async function gravarArquivo() {
  if (!handle) return; if (gravando) { agendar(); return; }
  gravando = true; clearTimeout(fileTimer); setSaveStatus(); const r0 = rev;
  try {
    if (!overwriteNext && lastFileSha) {                       // outro computador mexeu? junta antes
      const f = await lerArquivo(handle).catch(() => null);
      if (f && !f.empty && f.sha && f.sha !== lastFileSha) { state = mergeStates(state, f.dados); persistir(); refresh(); }
    }
    const json = JSON.stringify(state), sha = await sha256(json);
    const w = await handle.createWritable();
    await w.write(`{"app":${JSON.stringify(SAVE_CFG.appId)},"formato":1,"salvoEm":"${new Date().toISOString()}","rev":${r0},"sha256":${JSON.stringify(sha)},"dados":${json}}`);
    await w.close();
    const f2 = await handle.getFile(); lastFileMod = f2.lastModified; lastFileSha = sha; lastFileTime = new Date(); overwriteNext = false;
    if (rev !== r0) agendar(); else fileRev = r0;               // editou durante a gravação: grava de novo
  } catch (e) {
    let perm = "denied"; try { perm = await handle.queryPermission({ mode: "readwrite" }); } catch {}
    if (perm !== "granted") { pendingHandle = handle; handle = null; } else setTimeout(agendar, 5000);
  }
  gravando = false; setSaveStatus();
}
async function conectar(h, carregarDoArquivo) {
  if (carregarDoArquivo) {
    const d = await lerArquivo(h);                              // lança erro se não for um arquivo do app
    handle = h; pendingHandle = null; try { await kvSet("arquivo", h); } catch {}
    lastFileMod = d.lastModified;
    if (d.empty) overwriteNext = true;
    else {
      if (!d.ok) toast("Atenção: o SHA-256 não confere. O arquivo foi editado fora do app");
      const pristino = !state.updatedAt;                        // só exemplos na tela: usa o arquivo como está
      state = pristino ? normalize(d.dados) : (d.salvoEm || "") > (localSalvoEm || "") ? mergeStates(d.dados, state) : mergeStates(state, d.dados);

      if (d.sha && d.sha === await sha256(JSON.stringify(state))) { fileRev = rev; lastFileTime = new Date(d.lastModified); persistir(); refresh(); return; }
    }
  } else { handle = h; pendingHandle = null; try { await kvSet("arquivo", h); } catch {} overwriteNext = true; }
  save(); refresh();
}
async function ativarArquivo() {       // "Criar arquivo de dados" (precisa de clique)
  if (!FS_OK) return toast("Para salvar em arquivo, abra o .html no Chrome ou Edge. Aqui, use o backup");
  try { const h = await showSaveFilePicker({ suggestedName: SAVE_CFG.arquivoSugerido, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] }); await conectar(h, false); toast("Arquivo conectado. Cada alteração é gravada nele"); }
  catch (e) { if (e.name !== "AbortError") toast("Não foi possível criar o arquivo"); }
}
async function abrirArquivo() {        // "Abrir arquivo existente"
  if (!FS_OK) return toast("Para salvar em arquivo, abra o .html no Chrome ou Edge. Aqui, use o backup");
  try { const [h] = await showOpenFilePicker({ types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
    if (await h.requestPermission({ mode: "readwrite" }) !== "granted") return;
    await conectar(h, true); toast("Arquivo conectado: " + h.name); }
  catch (e) { if (e.name !== "AbortError") toast(e.message === "formato" || e instanceof SyntaxError ? "Este arquivo não é do Órbita Kanban" : "Não foi possível abrir o arquivo"); }
}
async function reconectarArquivo() {   // "Reconectar arquivo" (precisa de clique)
  if (!pendingHandle) return;
  try { if (await pendingHandle.requestPermission({ mode: "readwrite" }) === "granted") await conectar(pendingHandle, true); } catch { toast("Não foi possível reconectar. Abra o arquivo de novo em Configurações"); }
  setSaveStatus();
}
async function desconectarArquivo() { handle = null; pendingHandle = null; fileRev = -1; lastFileSha = null; clearTimeout(fileTimer); try { await kvSet("arquivo", undefined); } catch {} refresh(); }
async function iniciarArquivo() {      // ao abrir a página
  if (!FS_OK) return; let h = null; try { h = await esperar(kvGet("arquivo"), 2000); } catch {} if (!h) return;
  let perm = "prompt"; try { perm = await h.queryPermission({ mode: "readwrite" }); } catch {}
  if (perm === "granted") { try { await conectar(h, true); } catch { pendingHandle = h; handle = null; } } else pendingHandle = h;
  setSaveStatus();
}
setInterval(async () => {              // a cada 20 s: outro computador mudou o arquivo?
  if (!handle || gravando) return;
  try { const f = await handle.getFile(); if (lastFileMod === null || f.lastModified === lastFileMod) return;
    const d = await lerArquivo(handle); lastFileMod = d.lastModified;
    if (d.empty || !d.sha || d.sha === lastFileSha || overwriteNext) return;
    if (rev === fileRev) { state = normalize(d.dados); lastFileSha = d.sha; persistir(); refresh(); }
    else { state = mergeStates(state, d.dados); lastFileSha = d.sha; save(); refresh(); }
  } catch {}
}, SAVE_CFG.conferirArquivoMs);

/* ===== camada 3: redes de segurança ===== */
function semArquivo() { if (remote && ui.sync !== "err") return dirty || pushing; return handle ? (rev !== fileRev || gravando) : rev > Math.max(revAoAbrir, meta.exportRev || 0, meta.dlRev || 0); }
