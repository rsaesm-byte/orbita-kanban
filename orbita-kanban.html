<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órbita Kanban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: uma bancada de trabalho. Colunas sao lajes com espessura, cartoes inclinam sob o cursor
   e viram para mostrar o verso. A cor de destaque e customizavel por matiz (--ah). */
@property --spin { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
@property --tilt { syntax: "<angle>"; inherits: true; initial-value: 62deg; }
@property --so { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
:root {
  --ah: 190;
  --bg: #e6ecec; --bg2: #d8e1e1; --surface: #ffffff; --surface2: #f2f6f6;
  --ink: #0f1f20; --ink2: #47595b; --ink3: #74878a; --line: #cdd8d8; --edge: #b4c2c2;
  --accent: oklch(0.5 0.1 var(--ah)); --accent-ink: #ffffff; --accent-soft: oklch(0.93 0.04 var(--ah));
  --p0: #cf2f36; --p1: #c9650a; --p2: #8f7400; --p3: #557585;
  --s1: #6b5fd3; --s2: #0b8f87;
  --tl: 0.93; --tc: 0.045; --tt: 0.36;
  --shadow: 15 40 42; --glow: .3; --dim: 15 31 32 / .22;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --pad: 12px; --gap: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1415; --bg2: #101c1d; --surface: #172527; --surface2: #1e2f31;
    --ink: #e6f1ef; --ink2: #a6baba; --ink3: #778f90; --line: #2b4042; --edge: #070d0e;
    --accent: oklch(0.78 0.12 var(--ah)); --accent-ink: #06201f; --accent-soft: oklch(0.33 0.05 var(--ah));
    --p0: #ff6b6f; --p1: #ffa04d; --p2: #e6c84a; --p3: #8fb0c0;
    --s1: #9085e9; --s2: #24a89e;
    --tl: 0.34; --tc: 0.06; --tt: 0.9;
    --shadow: 0 0 0; --glow: .1; --dim: 0 0 0 / .5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1415; --bg2: #101c1d; --surface: #172527; --surface2: #1e2f31;
  --ink: #e6f1ef; --ink2: #a6baba; --ink3: #778f90; --line: #2b4042; --edge: #070d0e;
  --accent: oklch(0.78 0.12 var(--ah)); --accent-ink: #06201f; --accent-soft: oklch(0.33 0.05 var(--ah));
  --p0: #ff6b6f; --p1: #ffa04d; --p2: #e6c84a; --p3: #8fb0c0;
  --s1: #9085e9; --s2: #24a89e;
  --tl: 0.34; --tc: 0.06; --tt: 0.9;
  --shadow: 0 0 0; --glow: .1; --dim: 0 0 0 / .5;
  color-scheme: dark;
}
:root[data-density="compact"] { --pad: 8px; --gap: 6px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- topo ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 30px; height: 30px; position: relative; flex: none; }
.logo i { position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 50%; transform: rotateX(62deg) rotateZ(20deg); }
.logo b { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--accent); }
.logo u { position: absolute; right: 0; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--p1); }
.board-name { font: 700 20px/1.1 var(--display); letter-spacing: -0.01em; background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; width: 14ch; min-width: 0; }
.board-name:hover, .board-name:focus { border-color: var(--line); background: var(--surface); }
.tabs { display: flex; gap: 2px; background: var(--bg2); padding: 3px; border-radius: 10px; }
.tabs a { padding: 5px 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(var(--shadow) / .18); }
.brand .menu-body { left: 0; right: auto; width: 250px; }
.menu-body button.on { background: var(--accent-soft); font-weight: 600; }
.menu-body button small { float: right; color: var(--ink3); font-weight: 400; }
.menu-body hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { color: var(--p0); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.search-btn { color: var(--ink3); min-width: 190px; justify-content: flex-start; }
.search-btn kbd { margin-left: auto; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink2); background: var(--surface2); }
.bell { position: relative; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--p0); color: #fff; font: 600 10px/17px var(--body); text-align: center; padding: 0 4px; }

.strip { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.next { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pc, var(--accent)); border-radius: 8px; padding: 5px 10px; max-width: 100%; min-width: 0; text-align: left; }
.next small { color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; font-weight: 600; }
.next b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.sync { font-size: 12px; color: var(--ink3); display: inline-flex; align-items: center; gap: 5px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--s2); }
.sync.busy::before { background: var(--p2); } .sync.err::before { background: var(--p0); }

main { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---------- quadro ---------- */
.board { padding: 6px 16px 28px; min-height: 100%; width: max-content; perspective: 1500px; perspective-origin: 50vw 20vh; }
.stage { display: flex; gap: 14px; align-items: flex-start; transform-style: preserve-3d; transform-origin: 50vw 30vh; transform: rotateX(var(--bx, 0deg)) rotateY(var(--by, 0deg)); transition: transform .3s ease-out; }
.col { width: 292px; flex: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column;
  box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 3px 0 var(--edge), 0 4px 0 var(--edge), 0 5px 0 var(--edge), 0 16px 26px -10px rgb(var(--shadow) / .35);
  transform-origin: 50% 0; transition: transform .35s; }
/* Total: profundidade de verdade. A altura do cartão é a prioridade, a sombra fica no chão da coluna e tudo responde à câmera */
@property --z { syntax: "<length>"; inherits: true; initial-value: 0px; }
:root[data-depth="2"] .col, :root[data-depth="2"] .col-list { transform-style: preserve-3d; }
:root[data-depth="2"] .card { perspective: none; transform-style: preserve-3d; --z: calc(8px + (3 - var(--p, 2)) * 15px); translate: 0 0 var(--z); transition: transform .18s ease-out, --z .35s cubic-bezier(.2,.8,.2,1); animation: bob 6s ease-in-out infinite; animation-delay: calc(var(--j, 0) * -1.3s - var(--i, 0) * .7s); }
:root[data-depth="2"] .card:hover { --z: 78px; }
:root[data-depth="2"] .card::before { content: ""; position: absolute; inset: 10px 8px -2px; border-radius: 14px; background: rgb(var(--shadow) / .5); filter: blur(10px); transform: translateZ(calc(1px - var(--z))); pointer-events: none; }
:root[data-depth="2"] .face, :root[data-depth="2"] .card:hover .face { box-shadow: 0 1px 0 var(--edge); }
:root[data-depth="2"] .board.enter .card { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) backwards, bob 6s ease-in-out infinite; animation-delay: calc(var(--i) * 80ms + var(--j) * 55ms + 240ms), calc(var(--j, 0) * -1.3s - var(--i, 0) * .7s); }
@keyframes bob { 50% { translate: 0 0 calc(var(--z) + 8px); } }
.ghost { animation: none !important; translate: none !important; perspective: 900px !important; }
.ghost::before { display: none !important; }
/* vida: quem está atrasado pulsa, quem está com o cronômetro ligado respira */
:root:not([data-depth="0"]) .card.late .face { animation: late 1.8s ease-in-out infinite; }
@keyframes late { 50% { box-shadow: 0 0 0 2px var(--p0), 0 0 28px -2px var(--p0); } }
:root:not([data-depth="0"]) .card.running .face { animation: run 2.4s ease-in-out infinite; }
@keyframes run { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 30px -2px var(--accent); } }
.motes { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
:root:not([data-depth="0"]) .col:hover { transform: translateZ(30px); }
:root[data-depth="2"] .col:hover { transform: translateZ(22px); }
:root[data-depth="2"] .card:hover .card-in { --lift: 26px; }
.board.enter .col { animation: colIn .65s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms); }
@keyframes colIn { from { transform: rotateX(-72deg) translateZ(-140px) translateY(50px); opacity: 0; } }
.board.enter .card { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms + var(--j) * 55ms + 240ms); }
@keyframes cardIn { from { transform: perspective(600px) translateY(-28px) rotateX(60deg) scale(.9); opacity: 0; } }
:root[data-depth="0"] .col { box-shadow: none; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 12px; }
.col-dot { width: 10px; height: 10px; border-radius: 3px; background: oklch(0.62 0.13 var(--ch)); flex: none; }
.col-name { flex: 1; min-width: 0; font: 700 15px var(--display); background: none; border: 1px solid transparent; border-radius: 6px; padding: 2px 4px; }
.col-name:hover, .col-name:focus { border-color: var(--line); background: var(--surface); }
.count { font: 500 12px var(--mono); color: var(--ink3); }
.count.warn { color: var(--p0); font-weight: 600; }
.col-list { padding: 4px 10px; display: flex; flex-direction: column; gap: var(--gap); min-height: 46px; flex: 1; }
.empty { color: var(--ink3); font-size: 12px; text-align: center; padding: 14px 0; border: 1px dashed var(--line); border-radius: 10px; }
.quick { padding: 8px 10px 10px; }
.quick input { width: 100%; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 6px 9px; }
.quick input:focus { background: var(--surface); border-style: solid; }
.col-add { flex: none; width: 150px; border: 1px dashed var(--line); background: none; border-radius: 14px; padding: 12px; color: var(--ink2); }
.menu { position: relative; }
.menu summary { list-style: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; cursor: pointer; color: var(--ink2); }
.menu summary::-webkit-details-marker { display: none; }
.menu summary:hover { background: var(--surface); }
.menu-body { position: absolute; right: 0; top: 30px; z-index: 30; width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 4px; box-shadow: 0 14px 30px -8px rgb(var(--shadow) / .4); }
.menu-body button { text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; }
.menu-body button:hover { background: var(--surface2); }
.menu-body label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 8px; font-size: 13px; }
.menu-body input[type=number] { width: 60px; }
.hues { display: flex; gap: 5px; padding: 4px 8px; flex-wrap: wrap; }
.hue { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface); background: oklch(0.62 0.13 var(--h)); padding: 0; }
.hue.on { box-shadow: 0 0 0 2px var(--ink); }

/* cartao */
.card { position: relative; transform: translateY(var(--ty, 0px)) scale(var(--mag, 1)); z-index: var(--mz, 0); transition: transform .18s ease-out, filter .25s; perspective: 900px; user-select: none; -webkit-user-select: none; cursor: grab; border-radius: 10px; }
.card.lifted { display: none; }
.card-in { display: grid; transform-style: preserve-3d; transition: transform .25s cubic-bezier(.2,.8,.2,1); transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--flip, 0deg))) translateZ(var(--lift, 0px)); }
.card.flipped .card-in { --flip: 180deg; }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 10px; padding: var(--pad); display: flex; flex-direction: column; gap: 7px; min-width: 0; position: relative; overflow: hidden;
  box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 6px 12px -6px rgb(var(--shadow) / .35); }
:root[data-depth="0"] .face { box-shadow: 0 1px 2px rgb(var(--shadow) / .15); }
.face.back { transform: rotateY(180deg); background: var(--surface2); }
.card:not(.flipped) .back, .card.flipped .front { pointer-events: none; }
.face.front::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--glare, 0); transition: opacity .2s; background: radial-gradient(220px circle at var(--gx, 50%) var(--gy, 0%), rgb(255 255 255 / .22), transparent 60%); }
.card:hover .card-in { --lift: 14px; }
.card:hover .face { box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 18px 24px -12px rgb(var(--shadow) / .5); }
.p0 { --pc: var(--p0); } .p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); } .p3 { --pc: var(--p3); }
.c-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tk { font: 500 11.5px var(--mono); color: var(--ink2); white-space: nowrap; }
.pri { font-size: 11px; font-weight: 600; color: var(--pc); display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: .04em; }
.pri::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }
.card h3 { margin: 0; font: 600 14px/1.3 var(--body); overflow-wrap: anywhere; }
.card.done h3 { color: var(--ink3); text-decoration: line-through; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: oklch(var(--tl) var(--tc) var(--h)); color: oklch(var(--tt) 0.09 var(--h)); border: 0; white-space: nowrap; }
button.tag { opacity: .45; } button.tag.on { opacity: 1; box-shadow: 0 0 0 1.5px oklch(var(--tt) 0.09 var(--h)); }
.c-meta { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: 12px; flex-wrap: wrap; }
.c-meta span { display: inline-flex; align-items: center; gap: 4px; }
.c-meta svg { width: 13px; height: 13px; }
.due.over { color: var(--p0); font-weight: 600; } .due.today { color: var(--p1); font-weight: 600; } .due.soon { color: var(--p2); font-weight: 600; }
.icon-btn { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: none; border-radius: 6px; color: var(--ink3); padding: 0; }
.icon-btn:hover { background: var(--surface2); color: var(--ink); }
.bar { height: 4px; border-radius: 2px; background: var(--bg2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.back ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; max-height: 160px; overflow: auto; }
.back label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; }
.back p { margin: 0; color: var(--ink2); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.running .face { border-color: var(--accent); }
.ph { border: 2px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); opacity: .7; flex: none; }
.ghost { transition: none; filter: none !important; position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; cursor: grabbing; }
.ghost .card-in { --lift: 40px; transition: transform .12s; }
.ghost .face { box-shadow: 0 30px 40px -14px rgb(var(--shadow) / .6); }
body.dragging { cursor: grabbing; }
body.dragging .card { cursor: grabbing; }

/* ---------- orbita ---------- */
.orbit-wrap { padding: 6px 16px 24px; }
.orbit-info { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink2); font-size: 12.5px; max-width: 980px; margin: 0 auto 4px; }
.orbit-info b { color: var(--ink); }
.orbit { position: relative; margin: 0 auto; perspective: 1400px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.orbit:active { cursor: grabbing; }
.space { position: absolute; left: 50%; top: 44%; width: var(--S); height: var(--S); margin: calc(var(--S) / -2) 0 0 calc(var(--S) / -2); transform: rotateX(var(--tilt)); transform-style: preserve-3d; }
.lay { position: absolute; inset: 0; transform-style: preserve-3d; }
.lay.spin { transform: rotateZ(calc(var(--spin) + var(--so))); animation: spin 320s linear infinite; }
.orbit:hover .lay.spin { animation-play-state: paused; }
.orbit.enter .space { animation: orbIn .9s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes orbIn { from { --tilt: 82deg; scale: .72; opacity: 0; } }
.orbit.enter .planet i { animation: pIn .55s cubic-bezier(.2,1.4,.4,1) backwards; animation-delay: calc(var(--k) * 60ms + .45s); }
@keyframes pIn { from { transform: scale(0); } }
@keyframes spin { to { --spin: 360deg; } }
.ring { position: absolute; left: 50%; top: 50%; width: calc(var(--r) * 2); height: calc(var(--r) * 2); margin: calc(var(--r) * -1); border-radius: 50%; border: 1.5px dashed var(--line); }
.ring.r0 { background: radial-gradient(circle, color-mix(in oklab, var(--p0) 22%, transparent), transparent 70%); border-color: var(--p0); border-style: solid; }
.bb { position: absolute; left: 50%; top: 50%; transform-origin: 50% 100%; transform: translate(-50%, -100%) translate3d(var(--x), var(--y), 0) rotateX(calc(var(--tilt) * -1)); }
.spin .bb { transform: translate(-50%, -100%) translate3d(var(--x), var(--y), 0) rotateZ(calc((var(--spin) + var(--so)) * -1)) rotateX(calc(var(--tilt) * -1)); }
.ring-l { display: block; font: 500 10.5px var(--mono); color: var(--ink2); white-space: nowrap; background: var(--bg); border: 1px solid var(--line); padding: 0 7px; border-radius: 99px; translate: 0 50%; }
.planet { background: none; border: 0; padding: 0; display: grid; justify-items: center; gap: 2px; width: 132px; pointer-events: none; }
.planet > * { pointer-events: auto; }
.planet.nolabel span, .planet.nolabel em { opacity: 0; pointer-events: none; transition: opacity .15s; }
.planet.nolabel:hover span, .planet.nolabel:hover em, .planet.nolabel:focus-visible span, .planet.nolabel:focus-visible em { opacity: 1; }
.planet i { width: var(--d); height: var(--d); border-radius: 50%; background: radial-gradient(circle at 32% 28%, color-mix(in oklab, var(--pc) 55%, #fff), var(--pc) 55%, color-mix(in oklab, var(--pc) 60%, #000)); box-shadow: 0 10px 14px -6px rgb(var(--shadow) / .6); transition: transform .2s; }
.planet:hover i, .planet:focus-visible i { transform: scale(1.25); }
.planet span { font-size: 11.5px; line-height: 1.25; max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--bg); border: 1px solid var(--line); padding: 0 6px; border-radius: 99px; }
.planet:hover span { border-color: var(--pc); }
.planet em { font: 500 10.5px var(--mono); color: var(--ink2); font-style: normal; }
.sun { width: 66px; height: 66px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(circle at 35% 30%, #ffe2a8, #f5a623 60%, #c9650a); color: #3a1d00; font: 700 19px/1 var(--display); box-shadow: 0 0 40px 6px rgb(245 166 35 / .45); }
.sun small { font: 600 9px var(--body); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- lista ---------- */

<script>

    if (c.nodeType !== 1 || !RT_OK[c.tagName]) { if (c.nodeType === 1 && !/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH)$/i.test(c.tagName)) { walk(c); c.replaceWith(...c.childNodes); } else c.remove(); return; }

  if (tilted && tilted !== card) { const i = $(".card-in", tilted); if (i) { i.style.removeProperty("--rx"); i.style.removeProperty("--ry"); } tilted.style.removeProperty("--glare"); tilted = null; }
  if (!card || calm.matches || !state.settings.depth || e.pointerType === "touch") return;
  const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height, k = state.settings.depth === 2 ? 16 : 5, inn = $(".card-in", card);
  inn.style.setProperty("--ry", ((px - .5) * k).toFixed(2) + "deg"); inn.style.setProperty("--rx", ((.5 - py) * k).toFixed(2) + "deg");
  card.style.setProperty("--gx", px * 100 + "%"); card.style.setProperty("--gy", py * 100 + "%"); card.style.setProperty("--glare", "1"); tilted = card;
}
/* dicas dos gráficos e da órbita */
document.addEventListener("mousemove", e => { const el = e.target.closest && e.target.closest("[data-tip]"), tip = $("#tip"); if (!el || drag) { tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false; tip.style.left = clamp(e.clientX + 12, 4, innerWidth - tip.offsetWidth - 4) + "px"; tip.style.top = (e.clientY - 34 < 4 ? e.clientY + 16 : e.clientY - 34) + "px"; });

/* ================= início ================= */
function route() { const h = location.hash.slice(1), prev = ui.view; ui.view = VIEWS.some(v => v[0] === h) ? h : "quadro"; if (route.done && prev !== ui.view) { renderChrome(); transit("flip", render); } else { if (!route.done) ui.enter = true; render(); } route.done = true; }
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { if (ui.view === "orbita" || ui.view === "relatorios") renderView(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pull(); checkDue(); } });
setInterval(() => { $$("[data-timer]").forEach(el => { const t = task(el.dataset.timer); if (t) el.textContent = fmtClock(spent(t)); }); }, 1000);
setInterval(() => checkDue(), 60000);
iniciarSalvamento();
</script>
