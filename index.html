<style>
/* Layout: uma bancada de trabalho. Colunas sao lajes com espessura, cartoes inclinam sob o cursor
   e viram para mostrar o verso. A cor de destaque e customizavel por matiz (--ah). */
@property --spin { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
@property --tilt { syntax: "<angle>"; inherits: true; initial-value: 62deg; }
@property --so { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
:root {
  --ah: 190;
  --bg: #e6ecec; --bg2: #d8e1e1; --surface: #ffffff; --surface2: #f2f6f6;
  --ink: #0f1f20; --ink2: #47595b; --ink3: #74878a; --line: #cdd8d8; --edge: #b4c2c2;
  --accent: oklch(0.5 0.1 var(--ah)); --accent-ink: #ffffff; --accent-soft: oklch(0.93 0.04 var(--ah));
  --p0: #cf2f36; --p1: #c9650a; --p2: #8f7400; --p3: #557585;
  --s1: #6b5fd3; --s2: #0b8f87;
  --tl: 0.93; --tc: 0.045; --tt: 0.36;
  --shadow: 15 40 42; --glow: .3; --glow2: .55; --dim: 15 31 32 / .22;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --pad: 12px; --gap: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1415; --bg2: #101c1d; --surface: #172527; --surface2: #1e2f31;
    --ink: #e6f1ef; --ink2: #a6baba; --ink3: #778f90; --line: #2b4042; --edge: #070d0e;
    --accent: oklch(0.78 0.12 var(--ah)); --accent-ink: #06201f; --accent-soft: oklch(0.33 0.05 var(--ah));
    --p0: #ff6b6f; --p1: #ffa04d; --p2: #e6c84a; --p3: #8fb0c0;
    --s1: #9085e9; --s2: #24a89e;
    --tl: 0.34; --tc: 0.06; --tt: 0.9;
    --shadow: 0 0 0; --glow: .1; --glow2: .14; --dim: 0 0 0 / .5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1415; --bg2: #101c1d; --surface: #172527; --surface2: #1e2f31;
  --ink: #e6f1ef; --ink2: #a6baba; --ink3: #778f90; --line: #2b4042; --edge: #070d0e;
  --accent: oklch(0.78 0.12 var(--ah)); --accent-ink: #06201f; --accent-soft: oklch(0.33 0.05 var(--ah));
  --p0: #ff6b6f; --p1: #ffa04d; --p2: #e6c84a; --p3: #8fb0c0;
  --s1: #9085e9; --s2: #24a89e;
  --tl: 0.34; --tc: 0.06; --tt: 0.9;
  --shadow: 0 0 0; --glow: .1; --glow2: .14; --dim: 0 0 0 / .5;
  color-scheme: dark;
}
:root[data-density="compact"] { --pad: 8px; --gap: 6px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- topo ---------- */
.top { position: relative; z-index: 60; display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: radial-gradient(circle at 30% 20%, #0b1636, #000 75%); box-shadow: 0 0 0 1px rgb(240 190 80 / .35), 0 4px 14px -4px rgb(47 123 255 / .55), inset 0 0 12px rgb(47 123 255 / .18); transition: box-shadow .3s, transform .3s; }
.logo svg { width: 30px; height: 30px; overflow: visible; }
.logo:hover { box-shadow: 0 0 0 1px rgb(240 190 80 / .7), 0 6px 20px -4px rgb(240 190 80 / .55), inset 0 0 14px rgb(47 123 255 / .3); transform: translateY(-1px) rotate(-4deg); }
.lg-moon, .lg-orb { transform-origin: 50px 50px; }
.lg-moon { animation: lgSpin 14s linear infinite; }
@keyframes lgSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .lg-moon { animation: none; } }
.board-name { font: 700 20px/1.1 var(--display); letter-spacing: -0.01em; background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; width: 14ch; min-width: 0; }
.board-name:hover, .board-name:focus { border-color: var(--line); background: var(--surface); }
.tabs { display: flex; gap: 2px; background: var(--bg2); padding: 3px; border-radius: 10px; }
.tabs a { padding: 5px 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(var(--shadow) / .18); }
.brand .menu-body { left: 0; right: auto; width: 300px; max-height: min(78vh, 560px); overflow-y: auto; }
.menu-body button.on { background: var(--accent-soft); font-weight: 600; }
.menu-body button small { float: right; color: var(--ink3); font-weight: 400; }
.menu-body hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { color: var(--p0); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.search-btn { color: var(--ink3); min-width: 190px; justify-content: flex-start; }
.search-btn kbd { margin-left: auto; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink2); background: var(--surface2); }
.bell { position: relative; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--p0); color: #fff; font: 600 10px/17px var(--body); text-align: center; padding: 0 4px; }

.strip { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.next { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pc, var(--accent)); border-radius: 8px; padding: 5px 10px; max-width: 100%; min-width: 0; text-align: left; }
.next small { color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; font-weight: 600; }
.next b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.sync { font-size: 12px; color: var(--ink3); display: inline-flex; align-items: center; gap: 5px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--s2); }
.sync.busy::before { background: var(--p2); } .sync.err::before { background: var(--p0); }

main { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---------- quadro ---------- */
.board { padding: 6px 16px 28px; min-height: 100%; width: max-content; perspective: 1500px; perspective-origin: 50% 20vh; }
.stage { display: flex; gap: 14px; align-items: flex-start; transform-style: preserve-3d; transform-origin: 50vw 30vh; transform: rotateX(var(--bx, 0deg)) rotateY(var(--by, 0deg)); transition: transform .3s ease-out; }
.col { width: 292px; flex: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column;
  box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 3px 0 var(--edge), 0 4px 0 var(--edge), 0 5px 0 var(--edge), 0 16px 26px -10px rgb(var(--shadow) / .35);
  transform-origin: 50% 0; transition: transform .35s; }
/* Total: profundidade de verdade. A altura do cartão é a prioridade, a sombra fica no chão da coluna e tudo responde à câmera */
@property --z { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --cx { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --cy { syntax: "<length>"; inherits: true; initial-value: 0px; }
:root[data-depth="2"] .col, :root[data-depth="2"] .col-list { transform-style: preserve-3d; }
:root[data-depth="2"] .card { perspective: none; transform-style: preserve-3d; --z: calc(8px + (3 - var(--p, 2)) * 15px); translate: var(--cx) var(--cy) var(--z); transition: transform .18s ease-out, --z .35s cubic-bezier(.2,.8,.2,1), --cx .35s cubic-bezier(.2,.8,.2,1), --cy .35s cubic-bezier(.2,.8,.2,1); animation: none; }
:root[data-depth="2"] .card:hover { --z: 78px; }
:root[data-depth="2"] .card::before { content: ""; position: absolute; inset: 10px 8px -2px; border-radius: 14px; background: rgb(var(--shadow) / .5); filter: blur(10px); transform: translateZ(calc(1px - var(--z))); pointer-events: none; }
:root[data-depth="2"] .face, :root[data-depth="2"] .card:hover .face { box-shadow: 0 1px 0 var(--edge); }
:root[data-depth="2"] .board.enter .card { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms + var(--j) * 55ms + 240ms); }
@keyframes bob { 50% { translate: var(--cx) var(--cy) calc(var(--z) + 8px); } }
.ghost { animation: none !important; translate: none !important; perspective: 900px !important; }
.ghost::before { display: none !important; }
/* vida: quem está atrasado pulsa, quem está com o cronômetro ligado respira */
:root:not([data-depth="0"]) .card.late .face { animation: late 1.8s ease-in-out infinite; }
@keyframes late { 50% { box-shadow: 0 0 0 2px var(--p0), 0 0 28px -2px var(--p0); } }
:root:not([data-depth="0"]) .card.running .face { animation: run 2.4s ease-in-out infinite; }
@keyframes run { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 30px -2px var(--accent); } }
.motes { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
/* a coluna não sobe mais ao passar o mouse: com perspectiva isso empurrava as colunas das pontas para fora da tela */
:root[data-depth="2"] .card:hover .card-in { --lift: 26px; }
.board.enter .col { animation: colIn .65s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms); }
@keyframes colIn { from { transform: rotateX(-72deg) translateZ(-140px) translateY(50px); opacity: 0; } }
.board.enter .card { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms + var(--j) * 55ms + 240ms); }
@keyframes cardIn { from { transform: perspective(600px) translateY(-28px) rotateX(60deg) scale(.9); opacity: 0; } }
:root[data-depth="0"] .col { box-shadow: none; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 12px; }

.quick { padding: 6px 10px 10px; }
.qa-btn { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 9px; border: 0; border-radius: 10px; background: none; color: var(--ink2); font-weight: 500; text-align: left; transition: background .2s, color .2s; }
.qa-ico { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; transition: transform .3s cubic-bezier(.2,1.6,.4,1), background .2s, color .2s; }

.qa-box { display: none; gap: 7px; padding: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent), 0 8px 18px -10px rgb(var(--shadow) / .35); animation: qaIn .22s cubic-bezier(.2,.8,.2,1); }

.menu { position: relative; }
.menu summary { list-style: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; cursor: pointer; color: var(--ink2); }
.menu summary::-webkit-details-marker { display: none; }
.menu summary:hover { background: var(--surface); }
.menu-body { position: absolute; right: 0; top: 30px; z-index: 30; width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 4px; box-shadow: 0 14px 30px -8px rgb(var(--shadow) / .4); }
.menu-body button { text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; }

.menu-body label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 8px; font-size: 13px; }
.menu-body input[type=number] { width: 60px; }
.hues { display: flex; gap: 5px; padding: 4px 8px; flex-wrap: wrap; }
.hue { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface); background: oklch(0.62 0.13 var(--h)); padding: 0; }
.hue.on { box-shadow: 0 0 0 2px var(--ink); }

/* cartao */
.card { position: relative; transform: translateY(var(--ty, 0px)) scale(var(--mag, 1)); z-index: var(--mz, 0); transition: transform .18s ease-out, filter .25s; perspective: 900px; user-select: none; -webkit-user-select: none; cursor: grab; border-radius: 10px; }
.card.lifted { display: none; }
.card-in { display: grid; transform-style: preserve-3d; transition: transform .25s cubic-bezier(.2,.8,.2,1); transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--flip, 0deg))) translateZ(var(--lift, 0px)); }
.card.flipped .card-in { --flip: 180deg; }

  box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 6px 12px -6px rgb(var(--shadow) / .35); }
:root[data-depth="0"] .face { box-shadow: 0 1px 2px rgb(var(--shadow) / .15); }

.face.front::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--glare, 0); transition: opacity .2s; background: radial-gradient(220px circle at var(--gx, 50%) var(--gy, 0%), rgb(255 255 255 / .22), transparent 60%); }
.card:hover .card-in { --lift: 14px; }
.card:hover .face { box-shadow: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 18px 24px -12px rgb(var(--shadow) / .5); }
.p0 { --pc: var(--p0); } .p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); } .p3 { --pc: var(--p3); }
.c-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }

.due.over { color: var(--p0); font-weight: 600; } .due.today { color: var(--p1); font-weight: 600; } .due.soon { color: var(--p2); font-weight: 600; }

.icon-btn:hover { background: var(--surface2); color: var(--ink); }

.running .face { border-color: var(--accent); }

/* ---------- orbita: o observatório ---------- */
@property --wz { syntax: "<angle>"; inherits: true; initial-value: 0deg; }

.orbit-wrap { padding: 6px 16px 24px; }

.orbit:hover .lay.spin { animation-play-state: paused; }
@keyframes spin { to { --spin: 360deg; } }
.ring { position: absolute; left: 50%; top: 50%; width: calc(var(--r) * 2); height: calc(var(--r) * 2); margin: calc(var(--r) * -1); border-radius: 50%; border: 1.5px dashed color-mix(in oklab, var(--rc) 48%, transparent); box-shadow: 0 0 16px color-mix(in oklab, var(--rc) 16%, transparent), inset 0 0 24px color-mix(in oklab, var(--rc) 7%, transparent); transition: opacity .3s, border-color .3s, box-shadow .3s; }
.ring.r0 { background: radial-gradient(circle, color-mix(in oklab, var(--rc) 24%, transparent), transparent 70%); border-style: solid; }
.bb { position: absolute; left: 50%; top: 50%; transform-origin: 50% 100%; transform: translate(-50%, -100%) translate3d(calc(var(--x) * var(--m)), calc(var(--y) * var(--m)), 0) rotateX(calc(var(--tilt) * -1)); }
.spin .bb { transform: translate(-50%, -100%) translate3d(calc(var(--x) * var(--m)), calc(var(--y) * var(--m)), 0) rotateZ(calc((var(--spin) + var(--so) + var(--wz)) * -1)) rotateX(calc(var(--tilt) * -1)); }
.ring-l { display: block; font: 500 10.5px var(--mono); color: var(--rc); white-space: nowrap; background: rgba(8,12,32,.78); border: 1px solid color-mix(in oklab, var(--rc) 40%, transparent); padding: 0 7px; border-radius: 99px; translate: 0 50%; transition: opacity .3s; }
.planet { background: none; border: 0; padding: 0; display: grid; justify-items: center; gap: 2px; width: 132px; pointer-events: none; color: inherit; transition: opacity .3s; }
.planet > * { pointer-events: auto; }

.planet.nolabel:hover span, .planet.nolabel:hover em, .planet.nolabel:focus-visible span, .planet.nolabel:focus-visible em { opacity: 1; }
.planet i { position: relative; width: var(--d); height: var(--d); border-radius: 50%; background: radial-gradient(circle at 32% 28%, color-mix(in oklab, var(--pc) 45%, #fff), var(--pc) 52%, color-mix(in oklab, var(--pc) 55%, #000)); box-shadow: inset -5px -7px 11px rgba(0,0,40,.5); transition: transform .2s; }
.planet i b { position: absolute; inset: -80%; border-radius: 50%; z-index: -1; pointer-events: none; background: radial-gradient(circle, color-mix(in oklab, var(--pc) 55%, transparent) 0, transparent 62%); }
.planet.ck i::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: conic-gradient(var(--pc) var(--pct), rgba(255,255,255,.16) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }

@keyframes ping { from { transform: scale(.9); opacity: .9; } to { transform: scale(2.3); opacity: 0; } }
.planet:hover i, .planet:focus-visible i { transform: scale(1.28); }
.planet span { font-size: 11.5px; line-height: 1.25; max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(8,12,32,.78); color: #e8f0ff; border: 1px solid rgba(150,180,255,.26); padding: 0 6px; border-radius: 99px; }
.planet:hover span { border-color: var(--pc); }
.planet em { font: 500 10.5px var(--mono); color: #9fb4ff; font-style: normal; }
.sun { width: 74px; height: 74px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(circle at 35% 30%, #fff1c9, #ffb52e 55%, #d4690c); color: #3a1d00; font: 700 22px/1 var(--display); }
.sun-glow { position: absolute; z-index: 0; left: 50%; top: 50%; width: calc(var(--S) * .46); height: calc(var(--S) * .46); margin: calc(var(--S) * -.23) 0 0 calc(var(--S) * -.23); border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,185,60,.5), rgba(255,120,25,.2) 38%, transparent 68%); }
.obs.cine .sun-rays { animation: rot 55s linear infinite, glowIn calc(1.8s * var(--cs)) ease-out calc(.6s * var(--cs)) backwards; }
.obs.cine .sun-glow { animation: glowIn calc(1.6s * var(--cs)) ease-out calc(.5s * var(--cs)) backwards; } @keyframes glowIn { from { transform: scale(0); opacity: 0; } }
.sun small { font: 600 9px var(--body); letter-spacing: .08em; text-transform: uppercase; }
.sun-rays { position: absolute; left: 50%; top: 50%; width: calc(var(--S) * .3); height: calc(var(--S) * .3); margin: calc(var(--S) * -.15) 0 0 calc(var(--S) * -.15); border-radius: 50%; pointer-events: none; background: conic-gradient(transparent 0 8%, rgba(255,205,110,.55) 10% 11%, transparent 13% 25%, rgba(255,205,110,.36) 27% 28%, transparent 30% 45%, rgba(255,205,110,.55) 47% 48%, transparent 50% 70%, rgba(255,205,110,.36) 72% 73%, transparent 75%); -webkit-mask: radial-gradient(circle, transparent 20%, #000 24%, transparent 68%); mask: radial-gradient(circle, transparent 20%, #000 24%, transparent 68%); animation: rot 55s linear infinite; }
.sun-ping { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 2px solid rgba(255,190,80,.75); pointer-events: none; animation: ping 3.4s ease-out infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.obs-flash, .obs-wave { position: absolute; left: 50%; top: 44%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; pointer-events: none; opacity: 0; }
.obs-flash { background: radial-gradient(circle, rgba(255,236,190,.95), rgba(255,170,60,.4) 45%, transparent 70%); }
.obs-wave { border: 2px solid rgba(255,225,160,.8); }

@keyframes skipOut { to { opacity: 0; visibility: hidden; } }

/* painéis laterais: o que é o quê */
.obs-side { display: grid; gap: 10px; align-content: start; padding: 14px; border-radius: 18px; background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02)); border: 1px solid rgba(160,185,255,.2); box-shadow: 0 10px 30px -14px rgba(0,0,0,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.obs-side h4 { margin: 0; font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: #9fb4ff; }
.obs-side .obs-lead { margin: 0; font-size: 12.5px; line-height: 1.45; color: rgba(215,228,255,.85); }
.obs-side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.obs-item { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: background .2s, border-color .2s, transform .2s; }
.obs-item:hover, .obs-item:focus-visible, .obs-item.on, .obs[data-lr="0"] .obs-item[data-ring="0"], .obs[data-lr="1"] .obs-item[data-ring="1"], .obs[data-lr="2"] .obs-item[data-ring="2"], .obs[data-lr="3"] .obs-item[data-ring="3"], .obs[data-lr="4"] .obs-item[data-ring="4"],
.obs[data-lp="0"] .obs-item[data-pri="0"], .obs[data-lp="1"] .obs-item[data-pri="1"], .obs[data-lp="2"] .obs-item[data-pri="2"], .obs[data-lp="3"] .obs-item[data-pri="3"] { background: rgba(255,255,255,.09); border-color: color-mix(in oklab, var(--rc, var(--pc)) 55%, transparent); transform: translateX(2px); }

  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 95%); mask-image: linear-gradient(to top, #000 10%, transparent 95%); animation: floor 9s linear infinite; transition: opacity .5s; }
@keyframes floor { to { background-position: 0 0, 0 72px; } }
:root[data-depth="0"] .floor, body:not([data-view="quadro"]):not([data-view="orbita"]) .floor { opacity: 0; }
main { transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-origin: 0 50%; }

.kpi:nth-child(2) { --n: 1; } .kpi:nth-child(3) { --n: 2; } .kpi:nth-child(4) { --n: 3; } .kpi:nth-child(5) { --n: 4; } .kpi:nth-child(6) { --n: 5; }
@keyframes tileIn { from { transform: perspective(700px) rotateX(-85deg) translateY(-14px); opacity: 0; } }

.bd-wave { position: absolute; left: 30%; top: 34%; width: 36vmin; height: 36vmin; margin: -18vmin 0 0 -18vmin; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--accent) 65%, transparent); box-shadow: 0 0 36px color-mix(in oklab, var(--accent) 35%, transparent); opacity: 0; animation: bdWave 1.8s cubic-bezier(.2,.7,.3,1) .15s forwards; }

@keyframes bdStage { from { scale: .9; translate: 0 36px; } }

.man-next b { color: var(--accent); white-space: nowrap; transition: transform .25s; }
.man-next:hover { background: var(--accent-soft); border-color: var(--accent); } .man-next:hover b { transform: translateX(5px); }

.man-faq summary::-webkit-details-marker { display: none; } .man-faq summary::after { content: "+"; font-size: 18px; color: var(--accent); transition: transform .25s; }
.man-faq details[open] summary::after { transform: rotate(45deg); } .man-faq details[open] { border-color: var(--accent); background: var(--surface); }

@media (max-width: 900px) {
  .man > * { min-width: 0; }
  .man { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px 12px 60px; }
  .man-toc { position: sticky; top: 0; z-index: 5; max-height: none; overflow: visible; background: var(--bg); padding: 6px 0; margin: 0 -12px; padding-inline: 12px; }

}
.tab-x { }
@media (max-width: 760px) { .tab-x { display: none; } }

/* ===== tema claro: limpo e nítido (superfícies sólidas, bordas finas, sombras curtas) ===== */
html:root[data-theme="light"]{
  --bg: #f5f6f8; --bg2: #eceef2; --surface: #ffffff; --surface2: #f6f7f9;
  --ink: #161a22; --ink2: #4b5565; --ink3: #7a8392; --line: #e0e3e9; --edge: #cfd4dc;
  --accent: oklch(0.52 0.12 var(--ah)); --accent-soft: oklch(0.95 0.03 var(--ah));
  --shadow: 28 38 58; --glow: 0; --glow2: 0;
}
html:root[data-theme="light"] body { background: var(--bg); }
html:root[data-theme="light"] .aurora, html:root[data-theme="light"] .floor, html:root[data-theme="light"] .motes, html:root[data-theme="light"] .spot { display: none !important; }
html:root[data-theme="light"] .top { background: #fff; border-bottom: 1px solid var(--line); }
html:root[data-theme="light"] .tabs { background: var(--bg2); }
html:root[data-theme="light"] .tabs a.on { background: #fff; box-shadow: 0 1px 2px rgb(var(--shadow) / .12), 0 0 0 1px var(--line); }
html:root[data-theme="light"] .next, html:root[data-theme="light"] .btn, html:root[data-theme="light"] .search-btn { background: #fff; }
html:root[data-theme="light"] .btn:hover { border-color: var(--ink3); background: var(--surface2); }
html:root[data-theme="light"] .btn.main { background: var(--accent); }
html:root[data-theme="light"] .chip { background: #fff; }
html:root[data-theme="light"] .chip.on { background: var(--ink); }
html:root[data-theme="light"] .col { background: var(--bg2); border: 1px solid var(--line); box-shadow: none; }
html:root[data-theme="light"] .col-name:hover, html:root[data-theme="light"] .col-name:focus { background: #fff; }
html:root[data-theme="light"] .card::before { display: none !important; }
html:root[data-theme="light"] .card .face, html:root[data-theme="light"] .card:hover .face {
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--pc);
